<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BDA LIVE</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fafafa;color:#111}body{min-height:100vh;display:flex;flex-direction:column}header{padding:24px 38px 22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:#bd1724;font-size:18px;font-weight:800;letter-spacing:2px}.counter{display:flex;gap:8px;align-items:baseline}.counter strong{font-size:36px}.counter span{font-size:13px;color:#666;letter-spacing:1px}h1{margin:24px 0 0;font-size:clamp(30px,3vw,48px);line-height:1.08;letter-spacing:-1px}.redline{height:4px;background:#bd1724;width:100%}main{flex:1}.student{max-width:760px;margin:0 auto;padding:38px 24px 60px}.present{padding:36px 65px 45px}.text-answer{width:100%;border:2px solid #ddd;border-radius:12px;padding:17px 18px;font-size:20px;outline:none;background:#fff}.text-answer:focus{border-color:#bd1724}textarea.text-answer{min-height:150px;resize:vertical}.option{width:100%;margin-bottom:14px;padding:18px;border:2px solid #ddd;border-radius:12px;background:#fff;font-size:19px;text-align:left;cursor:pointer}.option.selected{border-color:#bd1724;background:#fff3f4}.submit{width:100%;margin-top:25px;padding:17px;border:0;border-radius:10px;background:#bd1724;color:#fff;font-size:18px;font-weight:750;cursor:pointer}.submit:disabled{opacity:.45;cursor:default}.thanks{text-align:center;margin-top:70px}.thanks-main{font-size:34px;font-weight:800}.thanks-sub{margin-top:10px;font-size:18px;color:#666}.waiting{height:55vh;display:flex;justify-content:center;align-items:center;font-size:28px;color:#777}.cloud{min-height:55vh;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;gap:28px 38px}.word{display:inline-flex;white-space:nowrap;line-height:.95;font-weight:800}.poll{width:min(1100px,90%);margin:20px auto}.poll-row{margin:25px 0}.poll-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}.poll-label{font-size:25px;font-weight:700}.poll-count{font-size:23px;font-weight:800;color:#bd1724}.bar-bg{height:38px;border-radius:7px;overflow:hidden;background:#e5e5e5}.bar{height:100%;background:#bd1724;border-radius:7px}.responses{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:17px;min-height:55vh;align-content:center}.response-card{background:#fff;border:1px solid #ddd;border-left:5px solid #bd1724;border-radius:8px;padding:20px 22px;font-size:21px;line-height:1.3}.error{max-width:760px;margin:35px auto;padding:18px;border:1px solid #e3b6bb;border-left:5px solid #bd1724;background:#fff;color:#333}footer{display:flex;justify-content:space-between;padding:0 38px 20px;color:#777;font-size:13px}.live{display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#17a34a;box-shadow:0 0 8px rgba(23,163,74,.5)}
  </style>
</head>
<body>
<header><div class="top"><div class="brand">BDA LIVE · LECTURE 0</div><div class="counter" id="counter"><strong id="count">0</strong><span>RESPONSES</span></div></div><h1 id="questionTitle">Loading…</h1></header>
<div class="redline"></div>
<main id="main"></main>
<footer><div>Big Data Analytics and Reasoning · Lecture 0</div><div class="live"><span class="dot"></span>LIVE</div></footer>
<script src="config.js"></script>
<script>
const VIEW=new URLSearchParams(location.search).get('view')==='present'?'present':'student';
const palette=['#111111','#bd1724','#273043','#4c4c4c','#8d1c2b'];
let current=null,selected=null;
function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
function hashString(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h)}
function sizeFor(c,m){if(m<=1)return 54;return Math.round(34+Math.pow((c-1)/(m-1),.72)*116)}
async function fetchText(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
function csvRows(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
async function loadActive(){const rows=csvRows(await fetchText(BDA_CONFIG.controlCsv));return ((rows[0]&&rows[0][1])||'Q1').trim()}
async function loadResponses(){const rows=csvRows(await fetchText(BDA_CONFIG.responsesCsv));const col=BDA_CONFIG.combinedResponseColumn??1;return rows.slice(1).map(r=>(r[col]||'').trim()).filter(v=>/^Q[1-4]\|\|\|/.test(v)).map(v=>{const p=v.indexOf('|||');return{qid:v.slice(0,p),answer:v.slice(p+3)}}).filter(x=>x.answer)}
async function getState(){const id=await loadActive();const q=BDA_CONFIG.questions.find(x=>x.id===id)||BDA_CONFIG.questions[0];const all=await loadResponses();const responses=all.filter(x=>x.qid===q.id).map(x=>x.answer);let items=[];if(q.type==='WORDCLOUD'){const map={};responses.forEach(v=>{const label=v.trim(),key=label.toLowerCase();if(!map[key])map[key]={label,count:0};map[key].count++});items=Object.values(map).sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label))}else if(q.type==='POLL'){items=q.options.map(o=>({label:o,count:responses.filter(x=>x===o).length}))}else items=responses.slice(-20).reverse().map(x=>({label:x,count:1}));return{question:q,count:responses.length,items}}
function renderStudent(d){const q=d.question;document.getElementById('counter').style.display='none';document.getElementById('questionTitle').textContent=q.question;if(current===q.id)return;current=q.id;selected=null;const m=document.getElementById('main');m.className='student';if(q.type==='POLL'){m.innerHTML='<div id="opts"></div><button class="submit" id="submit" disabled>SUBMIT</button>';q.options.forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{selected=o;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('submit').disabled=false};document.getElementById('opts').appendChild(b)});document.getElementById('submit').onclick=()=>send(selected);return}m.innerHTML=(q.type==='OPEN'?'<textarea id="answer" class="text-answer" maxlength="500" placeholder="Your answer…"></textarea>':'<input id="answer" class="text-answer" maxlength="80" autocomplete="off" placeholder="One word or short phrase">')+'<button class="submit" id="submit">SUBMIT</button>';document.getElementById('submit').onclick=()=>{const a=document.getElementById('answer').value.trim();if(a)send(a)}}
async function send(answer){if(!BDA_CONFIG.formAction||!BDA_CONFIG.formEntry)return showError('Google Form submission endpoint is not configured yet.');const body=new URLSearchParams();body.append(BDA_CONFIG.formEntry,current+'|||'+answer);await fetch(BDA_CONFIG.formAction,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});document.getElementById('main').innerHTML='<div class="thanks"><div class="thanks-main">✓ Response recorded</div><div class="thanks-sub">Watch the screen — the results are updating live.</div></div>'}
function renderPresent(d){document.getElementById('counter').style.display='flex';document.getElementById('questionTitle').textContent=d.question.question;document.getElementById('count').textContent=d.count;const m=document.getElementById('main');m.className='present';if(!d.items.length){m.innerHTML='<div class="waiting">Waiting for responses…</div>';return}if(d.question.type==='WORDCLOUD'){const max=Math.max(...d.items.map(x=>x.count));m.innerHTML='<div class="cloud">'+d.items.map(x=>`<span class="word" style="font-size:${sizeFor(x.count,max)}px;color:${palette[hashString(x.label)%palette.length]}">${esc(x.label)}</span>`).join('')+'</div>';return}if(d.question.type==='POLL'){const max=Math.max(1,...d.items.map(x=>x.count));m.innerHTML='<div class="poll">'+d.items.map(x=>{const p=d.count?Math.round(x.count/d.count*100):0;return `<div class="poll-row"><div class="poll-top"><span class="poll-label">${esc(x.label)}</span><span class="poll-count">${x.count} · ${p}%</span></div><div class="bar-bg"><div class="bar" style="width:${x.count/max*100}%"></div></div></div>`}).join('')+'</div>';return}m.innerHTML='<div class="responses">'+d.items.slice(0,12).map(x=>`<div class="response-card">${esc(x.label)}</div>`).join('')+'</div>'}
function showError(msg){document.getElementById('main').innerHTML='<div class="error"><strong>Setup in progress.</strong><br>'+esc(msg)+'</div>'}
async function refresh(){try{const d=await getState();VIEW==='present'?renderPresent(d):renderStudent(d)}catch(e){showError(e.message)}}
refresh();setInterval(refresh,VIEW==='present'?1800:3000);
</script>
</body>
</html>
